# ==============================================================================
# Nginx Virtual Host Configuration for SmartBiz Accounting (myaccounts360.com)
# Location on VPS: /etc/nginx/sites-available/myaccounts360.com.conf
# Enable via: sudo ln -s /etc/nginx/sites-available/myaccounts360.com.conf /etc/nginx/sites-enabled/
# ==============================================================================

# HTTP Server Block: Redirects to HTTPS (or handles ACME challenge for Certbot)
server {
    listen 80;
    listen [::]:80;
    server_name myaccounts360.com www.myaccounts360.com;

    # Let's Encrypt ACME Challenge Directory
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    # Redirect all HTTP traffic to HTTPS (Certbot will automatically configure this if preferred)
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS Server Block (Activated after Certbot runs)
# To obtain certificate run:
# sudo certbot --nginx -d myaccounts360.com -d www.myaccounts360.com
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name myaccounts360.com www.myaccounts360.com;

    # SSL Certificates (Managed by Certbot)
    ssl_certificate /etc/letsencrypt/live/myaccounts360.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/myaccounts360.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Maximum file upload size (needed for receipt OCR and bill imports)
    client_max_body_size 25M;

    # Access and Error Logs
    access_log /var/log/nginx/smartbiz_access.log;
    error_log /var/log/nginx/smartbiz_error.log;

    # Reverse Proxy to SmartBiz Container on Port 3001
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Standard Proxy Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Timeouts for heavy reports / AI extraction
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;

        # Caching & Buffering
        proxy_buffering on;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }

    # Static Assets Cache Optimization
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
